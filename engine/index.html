<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Engine</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="cover">
    <img src="../cover.png" alt="Portada">
</div>

<div id="scene">


    <div id="book">

    <div class="scene-layer current-scene">
        <img src="../images/libro/pagina-1.png" alt="Escena 1">
    </div>

    <div class="scene-layer next-scene">
        <img src="../images/libro/pagina-2.png" alt="Escena 2">
    </div>
<div class="back-turning-page">
    <div class="back-turning-front">
        <img src="../images/libro/pagina-1.png" alt="Escena anterior">
    </div>

    <div class="back-turning-back">
        <img src="../images/libro/pagina-2.png" alt="Escena anterior">
    </div>
</div>
    <div class="turning-page">
        <div class="turning-front">
            <img src="../images/libro/pagina-1.png" alt="Escena 1">
        </div>

        <div class="turning-back">
            <img src="../images/libro/pagina-2.png" alt="Escena 2">
        </div>
    </div>

</div>
</div>
        
<script src="script.js"></script>
</body>


</html>
